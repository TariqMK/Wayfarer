[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfarer"
description = "A private, offline desktop trip itinerary builder."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = ["pywebview>=6.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<1", "pyinstaller>=6.22,<7"]

[project.gui-scripts]
wayfarer = "wayfarer.app:main"

[tool.setuptools]
packages = ["wayfarer"]

[tool.setuptools.dynamic]
version = { attr = "wayfarer._version.__version__" }

[tool.setuptools.package-data]
wayfarer = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
